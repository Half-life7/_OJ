name: oj-dev

services:
  sandbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go-judge
      args:
        GO_JUDGE_IMAGE: ${GO_JUDGE_IMAGE:-criyle/go-judge:latest}
        DEBIAN_MIRROR_BASE: ${DEBIAN_MIRROR_BASE:-}
    privileged: true
    shm_size: ${JUDGE_SHM_SIZE:-512m}
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?dev.ps1 / dev.sh set this value}
    command:
      - -http-addr=:5050
      - -no-fallback
      - -auth-token=${SANDBOX_TOKEN:?dev.ps1 / dev.sh set this value}
      - -parallelism=${JUDGE_WORKERS:-2}
      - -time-limit-checker-interval=10ms
      - -file-timeout=30m
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-5050}:5050"
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl --fail --silent --max-time 3 -H "Authorization: Bearer $$SANDBOX_TOKEN" http://127.0.0.1:5050/version >/dev/null'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
